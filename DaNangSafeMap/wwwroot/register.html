<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - DaNang SafeMap</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: { 50: '#FFFDF8', 100: '#FDF7E7', 200: '#F5ECD7', 300: '#EBE0C8' },
                        emerald: { DEFAULT: '#2D8A6E', light: '#3DA885', dark: '#1F6B54' },
                        ocean: { DEFAULT: '#3B82A0', light: '#5BA3C0' },
                        charcoal: '#374151',
                        slate: { DEFAULT: '#64748B', light: '#94A3B8' }
                    },
                    fontFamily: { sans: ['Be Vietnam Pro', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>

<body class="bg-cream-100 text-charcoal font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <!-- Background decorations -->
    <div class="fixed inset-0 -z-10">
        <div class="absolute inset-0 bg-gradient-to-br from-cream-50 via-cream-100 to-cream-200"></div>
        <div class="absolute top-1/4 left-1/4 w-80 h-80 bg-emerald/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-ocean/5 rounded-full blur-3xl"></div>
    </div>

    <div class="w-full max-w-md">
        <!-- Logo -->
        <a href="index.html" class="flex items-center justify-center gap-3 mb-8">
            <div
                class="w-12 h-12 bg-gradient-to-br from-emerald to-emerald-dark rounded-xl flex items-center justify-center shadow-lg">
                <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <div>
                <span class="text-2xl font-bold text-emerald">DaNang</span>
                <span class="text-2xl font-bold text-charcoal">SafeMap</span>
            </div>
        </a>

        <!-- Form Card -->
        <div class="bg-white/90 backdrop-blur-xl rounded-3xl border border-emerald/10 p-8 shadow-xl">
            <h1 class="text-2xl font-bold text-charcoal text-center mb-2">Đăng Ký Tài Khoản</h1>
            <p class="text-slate text-center mb-8">Tham gia cộng đồng bảo vệ an ninh</p>

            <form id="registerForm" class="space-y-5">
                <!-- Full Name -->
                <div>
                    <label class="block text-sm font-medium text-charcoal mb-2">Họ và tên</label>
                    <input type="text" name="fullName" required
                        class="w-full px-4 py-3 bg-cream-50 border-2 border-emerald/15 rounded-xl text-charcoal placeholder-slate-light focus:border-emerald focus:outline-none focus:ring-2 focus:ring-emerald/10 transition-all"
                        placeholder="Nguyễn Văn A">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-charcoal mb-2">Email</label>
                    <input type="email" name="email" required
                        class="w-full px-4 py-3 bg-cream-50 border-2 border-emerald/15 rounded-xl text-charcoal placeholder-slate-light focus:border-emerald focus:outline-none focus:ring-2 focus:ring-emerald/10 transition-all"
                        placeholder="email@example.com">
                </div>

                <!-- Phone -->
                <div>
                    <label class="block text-sm font-medium text-charcoal mb-2">Số điện thoại</label>
                    <input type="tel" name="phone" required
                        class="w-full px-4 py-3 bg-cream-50 border-2 border-emerald/15 rounded-xl text-charcoal placeholder-slate-light focus:border-emerald focus:outline-none focus:ring-2 focus:ring-emerald/10 transition-all"
                        placeholder="0901 234 567">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-charcoal mb-2">Mật khẩu</label>
                    <input type="password" name="password" required minlength="6"
                        class="w-full px-4 py-3 bg-cream-50 border-2 border-emerald/15 rounded-xl text-charcoal placeholder-slate-light focus:border-emerald focus:outline-none focus:ring-2 focus:ring-emerald/10 transition-all"
                        placeholder="Tối thiểu 6 ký tự">
                </div>

                <!-- Terms -->
                <div class="flex items-start gap-3">
                    <input type="checkbox" required class="w-4 h-4 mt-1 accent-emerald rounded">
                    <span class="text-sm text-slate">
                        Tôi đồng ý với <a href="#"
                            class="text-emerald hover:text-emerald-dark hover:underline font-medium">Điều khoản sử
                            dụng</a>
                        và <a href="#" class="text-emerald hover:text-emerald-dark hover:underline font-medium">Chính
                            sách bảo mật</a>
                    </span>
                </div>

                <!-- Submit -->
                <button type="submit"
                    class="w-full py-3.5 bg-gradient-to-r from-emerald to-emerald-dark hover:from-emerald-light hover:to-emerald text-white font-semibold rounded-xl transition-all shadow-lg shadow-emerald/25 hover:shadow-emerald/40 hover:-translate-y-0.5">
                    Tạo Tài Khoản
                </button>
            </form>

            <!-- Login Link -->
            <p class="text-center text-slate mt-6">
                Đã có tài khoản?
                <a href="login.html" class="text-emerald hover:text-emerald-dark font-medium">Đăng nhập</a>
            </p>
        </div>

        <a href="index.html"
            class="flex items-center justify-center gap-2 mt-6 text-slate hover:text-emerald transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Quay lại trang chủ
        </a>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Đăng ký thành công! Vui lòng kiểm tra email để xác nhận. (Demo)');
        });
    </script>
</body>

</html>
