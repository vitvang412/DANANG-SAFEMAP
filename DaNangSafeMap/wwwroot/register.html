<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - DaNang SafeMap</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#FFFBEB', 100: '#FEF3C7', 200: '#FDE68A', 300: '#FCD34D', 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706', 700: '#B45309', 800: '#92400E', 900: '#78350F' },
                        dark: { 800: '#1F2937', 900: '#111827' }
                    },
                    fontFamily: { sans: ['Be Vietnam Pro', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/main.css">
</head>

<body class="bg-dark-900 text-white font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="fixed inset-0 bg-gradient-to-br from-dark-900 via-dark-800 to-primary-900/20 -z-10"></div>
    <div class="fixed bottom-1/4 right-1/4 w-80 h-80 bg-primary-400/10 rounded-full blur-3xl -z-10"></div>

    <div class="w-full max-w-md">
        <!-- Logo -->
        <a href="index.html" class="flex items-center justify-center gap-3 mb-8">
            <div
                class="w-12 h-12 bg-gradient-to-br from-primary-400 to-primary-600 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/30">
                <i data-lucide="shield-check" class="w-7 h-7 text-dark-900"></i>
            </div>
            <div>
                <span
                    class="text-2xl font-bold bg-gradient-to-r from-primary-300 to-primary-500 bg-clip-text text-transparent">DaNang</span>
                <span class="text-2xl font-bold text-white">SafeMap</span>
            </div>
        </a>

        <div class="bg-dark-800/80 backdrop-blur-xl rounded-2xl border border-primary-500/20 p-8 shadow-2xl">
            <h1 class="text-2xl font-bold text-white text-center mb-2">Đăng Ký Tài Khoản</h1>
            <p class="text-gray-400 text-center mb-8">Tham gia cộng đồng bảo vệ an ninh</p>

            <form id="registerForm" class="space-y-4">
                <!-- Full Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Họ và tên</label>
                    <div class="relative">
                        <i data-lucide="user"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                        <input type="text" name="fullName" required
                            class="w-full pl-12 pr-4 py-3 bg-dark-900 border border-primary-500/20 rounded-xl text-white placeholder-gray-500 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 transition-all"
                            placeholder="Nguyễn Văn A">
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                    <div class="relative">
                        <i data-lucide="mail"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                        <input type="email" name="email" required
                            class="w-full pl-12 pr-4 py-3 bg-dark-900 border border-primary-500/20 rounded-xl text-white placeholder-gray-500 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 transition-all"
                            placeholder="email@example.com">
                    </div>
                </div>

                <!-- Phone -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Số điện thoại</label>
                    <div class="relative">
                        <i data-lucide="phone"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                        <input type="tel" name="phone" required
                            class="w-full pl-12 pr-4 py-3 bg-dark-900 border border-primary-500/20 rounded-xl text-white placeholder-gray-500 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 transition-all"
                            placeholder="0901 234 567">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Mật khẩu</label>
                    <div class="relative">
                        <i data-lucide="lock"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                        <input type="password" name="password" required minlength="6"
                            class="w-full pl-12 pr-12 py-3 bg-dark-900 border border-primary-500/20 rounded-xl text-white placeholder-gray-500 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 transition-all"
                            placeholder="Tối thiểu 6 ký tự">
                    </div>
                </div>

                <!-- Terms -->
                <div class="flex items-start gap-3">
                    <input type="checkbox" required class="w-4 h-4 mt-1 accent-primary-500 rounded">
                    <span class="text-sm text-gray-400">
                        Tôi đồng ý với <a href="#" class="text-primary-400 hover:underline">Điều khoản sử dụng</a>
                        và <a href="#" class="text-primary-400 hover:underline">Chính sách bảo mật</a>
                    </span>
                </div>

                <!-- Submit -->
                <button type="submit"
                    class="w-full py-3.5 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-400 hover:to-primary-500 text-dark-900 font-semibold rounded-xl transition-all shadow-lg shadow-primary-500/25 hover:shadow-primary-500/40 flex items-center justify-center gap-2">
                    <i data-lucide="user-plus" class="w-5 h-5"></i>
                    Tạo Tài Khoản
                </button>
            </form>

            <!-- Login Link -->
            <p class="text-center text-gray-400 mt-6">
                Đã có tài khoản?
                <a href="login.html" class="text-primary-400 hover:text-primary-300 font-medium">Đăng nhập</a>
            </p>
        </div>

        <a href="index.html"
            class="flex items-center justify-center gap-2 mt-6 text-gray-500 hover:text-primary-400 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Quay lại trang chủ
        </a>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Đăng ký thành công! Vui lòng kiểm tra email để xác nhận. (Demo)');
        });
    </script>
</body>

</html>
