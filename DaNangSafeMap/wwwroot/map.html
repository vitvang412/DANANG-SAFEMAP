<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản Đồ An Ninh - DaNang SafeMap</title>
    <meta name="description" content="Bản đồ cảnh báo an ninh thời gian thực tại Đà Nẵng">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: { 50: '#FFFDF8', 100: '#FDF7E7', 200: '#F5ECD7', 300: '#EBE0C8' },
                        emerald: { DEFAULT: '#2D8A6E', light: '#3DA885', dark: '#1F6B54' },
                        ocean: { DEFAULT: '#3B82A0', light: '#5BA3C0' },
                        terracotta: { DEFAULT: '#D97B4A', light: '#E69B6F' },
                        charcoal: '#374151',
                        slate: { DEFAULT: '#64748B', light: '#94A3B8' }
                    },
                    fontFamily: { sans: ['Be Vietnam Pro', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/main.css">

    <style>
        body {
            overflow: hidden;
        }

        .map-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .map-container {
            flex: 1;
            position: relative;
        }

        #mapContainer {
            height: 100%;
            width: 100%;
            border-radius: 0;
        }

        .map-header {
            background: rgba(255, 253, 248, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(45, 138, 110, 0.1);
        }

        .sidebar {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 1000;
            width: 280px;
            max-height: calc(100% - 2rem);
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(45, 138, 110, 0.3);
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: calc(100% - 2rem);
                max-height: 40%;
                bottom: 1rem;
                top: auto;
            }
        }
    </style>
</head>

<body class="bg-cream-100 text-charcoal font-sans antialiased">
    <div class="map-page">
        <!-- Header -->
        <header class="map-header">
            <div class="max-w-full mx-auto px-4 md:px-6 py-3">
                <div class="flex items-center justify-between">
                    <a href="index.html" class="flex items-center gap-3 group">
                        <div
                            class="w-10 h-10 bg-gradient-to-br from-emerald to-emerald-dark rounded-xl flex items-center justify-center shadow-lg">
                            <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                            </svg>
                        </div>
                        <div class="hidden sm:block">
                            <span class="text-lg font-bold text-emerald">DaNang</span>
                            <span class="text-lg font-bold text-charcoal">SafeMap</span>
                        </div>
                    </a>

                    <h1 class="text-lg md:text-xl font-bold text-charcoal">Bản Đồ An Ninh</h1>

                    <div class="flex items-center gap-2">
                        <a href="report.html" class="btn-primary py-2 px-4 text-sm">
                            Báo Cáo Sự Cố
                        </a>
                        <a href="index.html"
                            class="hidden md:flex items-center gap-2 px-4 py-2 text-slate hover:text-emerald transition-colors">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 12H5M12 19l-7-7 7-7" />
                            </svg>
                            Trang chủ
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Map Container -->
        <div class="map-container">
            <!-- Sidebar Controls -->
            <div class="sidebar flex flex-col gap-3">
                <!-- Time Filter -->
                <div class="control-panel">
                    <label class="mb-2 block">Lọc theo thời gian</label>
                    <select id="timeFilter">
                        <option value="1">1 giờ qua</option>
                        <option value="6">6 giờ qua</option>
                        <option value="24" selected>24 giờ qua</option>
                        <option value="48">48 giờ qua</option>
                        <option value="168">7 ngày qua</option>
                    </select>
                </div>

                <!-- Type Filter -->
                <div class="control-panel">
                    <label class="mb-3 block">Loại cảnh báo</label>
                    <div class="flex flex-col gap-2.5">
                        <label class="flex items-center gap-2.5 cursor-pointer text-charcoal text-sm">
                            <input type="checkbox" checked class="accent-red-500 w-4 h-4">
                            <span class="w-3 h-3 bg-red-500 rounded-full"></span>
                            <span>Xâm phạm sở hữu</span>
                        </label>
                        <label class="flex items-center gap-2.5 cursor-pointer text-charcoal text-sm">
                            <input type="checkbox" checked class="accent-orange-500 w-4 h-4">
                            <span class="w-3 h-3 bg-orange-500 rounded-full"></span>
                            <span>Trật tự công cộng</span>
                        </label>
                        <label class="flex items-center gap-2.5 cursor-pointer text-charcoal text-sm">
                            <input type="checkbox" checked class="accent-yellow-500 w-4 h-4">
                            <span class="w-3 h-3 bg-yellow-500 rounded-full"></span>
                            <span>An ninh du lịch</span>
                        </label>
                        <label class="flex items-center gap-2.5 cursor-pointer text-charcoal text-sm">
                            <input type="checkbox" checked class="accent-blue-500 w-4 h-4">
                            <span class="w-3 h-3 bg-blue-500 rounded-full"></span>
                            <span>Tai nạn giao thông</span>
                        </label>
                    </div>
                </div>

                <!-- Legend -->
                <div class="control-panel">
                    <h4 class="text-sm font-semibold text-charcoal mb-3">Chú thích</h4>
                    <div class="flex flex-col gap-2 text-sm">
                        <div class="flex items-center gap-2.5">
                            <span class="w-4 h-4 bg-red-500 rounded-full shadow-sm"></span>
                            <span class="text-slate">Cướp giật, trộm cắp</span>
                        </div>
                        <div class="flex items-center gap-2.5">
                            <span class="w-4 h-4 bg-orange-500 rounded-full shadow-sm"></span>
                            <span class="text-slate">Gây rối, quậy phá</span>
                        </div>
                        <div class="flex items-center gap-2.5">
                            <span class="w-4 h-4 bg-yellow-500 rounded-full shadow-sm"></span>
                            <span class="text-slate">Lừa đảo, chèo kéo</span>
                        </div>
                        <div class="flex items-center gap-2.5">
                            <span class="w-4 h-4 bg-blue-500 rounded-full shadow-sm"></span>
                            <span class="text-slate">Tai nạn giao thông</span>
                        </div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="control-panel">
                    <h4 class="text-sm font-semibold text-charcoal mb-3">Thống kê 24h</h4>
                    <div class="grid grid-cols-2 gap-3 text-center">
                        <div class="p-2 bg-cream-100 rounded-lg">
                            <div class="text-lg font-bold text-emerald">47</div>
                            <div class="text-xs text-slate">Báo cáo mới</div>
                        </div>
                        <div class="p-2 bg-cream-100 rounded-lg">
                            <div class="text-lg font-bold text-ocean">12</div>
                            <div class="text-xs text-slate">Đã xác minh</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Map -->
            <div id="mapContainer"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
